# ─────────────────────────────────────────────────────────────────────
# AndrezOG — Continuous Integration
# Se ejecuta en cada push y pull request sobre ramas principales.
# Valida backend, frontend, imágenes Docker y ejecuta smoke tests
# contra la infraestructura completa levantada con Docker Compose.
#
# Principios:
#   - KISS: jobs independientes, steps auto-contenidos
#   - Fallo rápido: cualquier error detiene el job inmediatamente
#   - Seguridad: mínimos permisos, secrets nunca expuestos en log
#   - Preparado para escalar: estructura para añadir tests, escaneo,
#     quality gates y publicación en fases posteriores
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - release/**
      - hotfix/**
  pull_request:
    branches:
      - master
      - develop
      - release/**

# Permisos mínimos: solo lectura del contenido del repositorio.
# jobs específicos pueden solicitar más permisos si es necesario.
permissions:
  contents: read

# ─── Variables reutilizadas en varios jobs ────────────────────────
env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # VALIDATE BACKEND
  # ═══════════════════════════════════════════════════════════════
  validate-backend:
    name: "Validate Backend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-net

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup .NET ${{ env.DOTNET_VERSION }}"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "Cache NuGet packages"
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/backend-net.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore dependencies"
        run: dotnet restore

      - name: "Build"
        run: dotnet build --no-restore --configuration Release

      - name: "Publish (Release)"
        run: dotnet publish --no-restore --configuration Release --output ./publish /p:UseAppHost=false

  # ═══════════════════════════════════════════════════════════════
  # VALIDATE FRONTEND
  # ═══════════════════════════════════════════════════════════════
  validate-frontend:
    name: "Validate Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-angular

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: "Get pnpm store directory"
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: "Cache pnpm store"
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Build"
        run: pnpm build

  # ═══════════════════════════════════════════════════════════════
  # DOCKER COMPOSE VALIDATION & INTEGRATION TEST
  # ═══════════════════════════════════════════════════════════════
  # Combina validación y smoke tests en un solo job porque GitHub
  # Actions ejecuta cada job en una VM limpia. Si separásemos build
  # de test, habría que reconstruir las imágenes en el job de
  # integración, duplicando tiempo y recursos.
  # Si en el futuro se usa un runner compartido o artefactos Docker,
  # se podría dividir para acelerar el pipeline.
  integration-test:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]

    # Usamos docker-compose.ci.yml que tiene credenciales inline
    # y está optimizado para CI (sin volúmenes, restart no, etc.)
    env:
      COMPOSE_FILE: docker-compose.ci.yml

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate docker-compose configuration"
        run: docker compose config

      - name: "Build Docker images"
        run: docker compose build --parallel

      - name: "Verify images were created"
        run: |
          echo "📦 Imágenes construidas:"
          docker compose images

      - name: "Start infrastructure"
        shell: bash
        run: |
          echo "🚀 Levantando servicios..."
          docker compose up -d

          echo "⏳ Esperando que los servicios estén listos..."
          # docker-compose.ci.yml tiene healthchecks rápidos y
          # más reintentos, así que esperamos un tiempo prudencial
          sleep 30

          echo ""
          echo "📋 Estado de los servicios:"
          docker compose ps

      - name: "Smoke test — Backend health endpoint"
        uses: ./.github/actions/smoke-test
        with:
          url: "http://localhost:5201/health"
          expected_status: "200"
          max_retries: "12"
          retry_delay_seconds: "10"

      - name: "Smoke test — Frontend health endpoint"
        uses: ./.github/actions/smoke-test
        with:
          url: "http://localhost:4200/health"
          expected_status: "200"
          max_retries: "6"
          retry_delay_seconds: "10"

      - name: "Smoke test — Frontend serves HTML"
        uses: ./.github/actions/smoke-test
        with:
          url: "http://localhost:4200"
          expected_status: "200"
          max_retries: "6"
          retry_delay_seconds: "10"

      - name: "Display service logs on failure"
        if: failure()
        shell: bash
        run: |
          echo "📜 Logs del backend:"
          docker compose logs backend --tail 30 2>/dev/null || true
          echo ""
          echo "📜 Logs del frontend:"
          docker compose logs frontend --tail 30 2>/dev/null || true
          echo ""
          echo "📜 Logs de postgres:"
          docker compose logs postgres --tail 20 2>/dev/null || true

      - name: "Cleanup — stop and remove all containers"
        if: always()
        shell: bash
        run: |
          echo "🧹 Limpiando contenedores y volúmenes de CI..."
          docker compose down --volumes --remove-orphans --timeout 30
          echo "✅ Limpieza completada"

  # ═══════════════════════════════════════════════════════════════
  # PUBLISH DOCKER IMAGES
  # ═══════════════════════════════════════════════════════════════
  # Solo se ejecuta en pushes a master, después de que todos los
  # tests hayan pasado. Publica las imágenes en GitHub Container
  # Registry (GHCR).
  #
  # Tags generados:
  #   - latest:      siempre apunta al último commit en master
  #   - sha-xxxxxx:  tag inmutable para poder hacer rollback
  # ═══════════════════════════════════════════════════════════════
  publish:
    name: "Publish Docker Images"
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend, integration-test]

    # Solo en push a master, no en pull requests
    if: github.event_name == 'push' && github.ref_name == 'master'

    # Permisos necesarios para publicar packages en GHCR
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/andrezvd/andrezog-net/backend
      FRONTEND_IMAGE: ghcr.io/andrezvd/andrezog-net/frontend

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push Backend"
        uses: docker/build-push-action@v6
        with:
          context: ./backend-net
          file: ./backend-net/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}

      - name: "Build and push Frontend"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-angular
          file: ./frontend-angular/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}

      - name: "Verify published images"
        shell: bash
        run: |
          echo "✅ Imágenes publicadas correctamente:"
          echo "  - ${{ env.BACKEND_IMAGE }}:latest"
          echo "  - ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}"
          echo "  - ${{ env.FRONTEND_IMAGE }}:latest"
          echo "  - ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}"
          echo ""
          echo "🔗 https://github.com/${{ github.repository }}/pkgs/container/"
