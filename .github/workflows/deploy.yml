# ─────────────────────────────────────────────────────────────────────
# AndrezOG — Deploy to Cloud Run
# Se ejecuta automáticamente después de que CI pasa en master.
# Despliega backend y frontend desde GHCR a Cloud Run.
#
# Autenticación mediante Workload Identity Federation (sin claves).
# ─────────────────────────────────────────────────────────────────────

name: Deploy to Cloud Run

on:
  # Solo se ejecuta después de que el workflow CI terminó con éxito en master
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: andrezog
  PROJECT_NUMBER: "385625211033"
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  BACKEND_SERVICE: andrezog-backend
  FRONTEND_SERVICE: andrezog-frontend
  BACKEND_IMAGE: us-central1-docker.pkg.dev/andrezog/andrezog/backend
  FRONTEND_IMAGE: us-central1-docker.pkg.dev/andrezog/andrezog/frontend
  CLOUD_SQL_INSTANCE: andrezog:us-central1:andrez-db

jobs:
  deploy:
    name: "Deploy to Cloud Run"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ─── Login a Artifact Registry no es necesario ────────
      # Cloud Run en la misma región accede a Artifact Registry
      # automáticamente mediante IAM. No necesita credenciales.

      # ─── Migraciones de Base de Datos ─────────────────────
      # Cloud SQL no acepta conexiones directas desde internet.
      # Usamos Cloud SQL Auth Proxy en background.
      - name: "Start Cloud SQL Auth Proxy"
        run: |
          # Descargar Cloud SQL Auth Proxy
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          # Iniciar proxy en background
          ./cloud-sql-proxy ${{ env.CLOUD_SQL_INSTANCE }} --port 5432 &
          sleep 5
          echo "Proxy started"

      - name: "Run EF Core migrations"
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore ./backend-net/backend-net.csproj
          # Reemplazar Host por localhost y deshabilitar SSL (el proxy ya cifra)
          LOCAL_CS=$(echo "${{ secrets.DB_CONNECTION_STRING }}" | sed 's|Host=[^;]*|Host=localhost|; s|SSL Mode=[^;]*||; s|;*$||')
          LOCAL_CS="${LOCAL_CS};SSL Mode=Disable"
          dotnet ef database update \
            --connection "$LOCAL_CS" \
            --project ./backend-net/backend-net.csproj
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
          Jwt__Key: "Temporary-Key-For-Migrations-That-Is-At-Least-32-Characters!!"
          Jwt__Issuer: "AndrezOG"
          Jwt__Audience: "AndrezOG-Client"
          Jwt__ExpireMinutes: "60"
          ASPNETCORE_ENVIRONMENT: "Development"

      # ─── Backend ──────────────────────────────────────────
      - name: "Deploy Backend to Cloud Run"
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          image: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_HTTP_PORTS=8080
            ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}
            Jwt__Key=${{ secrets.JWT_KEY }}
            Jwt__Issuer=${{ secrets.JWT_ISSUER }}
            Jwt__Audience=${{ secrets.JWT_AUDIENCE }}
            Google__ClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            Google__ClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            Google__RedirectUri=${{ secrets.GOOGLE_REDIRECT_URI }}
            AdminEmails__0=${{ secrets.ADMIN_EMAIL }}

      # ─── Frontend ─────────────────────────────────────────
      - name: "Deploy Frontend to Cloud Run"
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          image: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            BACKEND_BASE_URL=https://${{ env.BACKEND_SERVICE }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app

      # ─── Mostrar URLs ─────────────────────────────────────
      - name: "Show deployed URLs"
        run: |
          echo ""
          echo "✅ Despliegue completado en Cloud Run:"
          echo ""
          echo "   Backend:"
          echo "   https://${{ env.BACKEND_SERVICE }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app"
          echo ""
          echo "   Frontend:"
          echo "   https://${{ env.FRONTEND_SERVICE }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app"
          echo ""
          echo "   Consola GCP:"
          echo "   https://console.cloud.google.com/run?project=${{ env.PROJECT_ID }}"

      # ─── Smoke test post-deploy ───────────────────────────
      - name: "Smoke test — Backend"
        uses: ./.github/actions/smoke-test
        with:
          url: https://${{ env.BACKEND_SERVICE }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/health
          expected_status: "200"
          max_retries: "12"
          retry_delay_seconds: "10"

      - name: "Smoke test — Frontend"
        uses: ./.github/actions/smoke-test
        with:
          url: https://${{ env.FRONTEND_SERVICE }}-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/health
          expected_status: "200"
          max_retries: "12"
          retry_delay_seconds: "10"
