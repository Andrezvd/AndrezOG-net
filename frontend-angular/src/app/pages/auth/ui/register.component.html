
<div class="register-container">
    <a routerLink="/" class="login-logo">AndrezOG</a>
    <div class="register-form">
        <h2>Crear Cuenta</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" [(ngModel)]="RegisterRequest.email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [(ngModel)]="RegisterRequest.password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" [(ngModel)]="RegisterRequest.confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" [(ngModel)]="RegisterRequest.name" name="name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" id="lastName" [(ngModel)]="RegisterRequest.lastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Número de Teléfono</label>
                <input type="text" id="phoneNumber" [(ngModel)]="RegisterRequest.phoneNumber" name="phoneNumber" required>
            </div>
            <div class="form-group">
                <label for="country">País</label>
                <input type="text" id="country" [(ngModel)]="RegisterRequest.country" name="country" required>
            </div>

            @if (errorMessage) {
                <p class="error-message">{{ errorMessage }}</p>
            }

            <button type="submit">Registrarse</button>
            <p class="login-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
        </form>
    </div>
</div>
