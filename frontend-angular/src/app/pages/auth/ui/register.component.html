<div class="auth-shell">
  <div class="auth-backdrop"></div>

  <div class="auth-card">
    <a routerLink="/" class="auth-logo">AndrezOG</a>
    <h2 class="auth-title">Crear Cuenta</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="auth-row">
        <div class="auth-field">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="RegisterRequest.name" name="name" required />
        </div>
        <div class="auth-field">
          <label>Apellido</label>
          <input type="text" [(ngModel)]="RegisterRequest.lastName" name="lastName" required />
        </div>
      </div>
      <div class="auth-field">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="RegisterRequest.email" name="email" required />
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="RegisterRequest.password" name="password" required />
      </div>
      <div class="auth-field">
        <label>Confirmar Contraseña</label>
        <input type="password" [(ngModel)]="RegisterRequest.confirmPassword" name="confirmPassword" required />
      </div>
      <div class="auth-field">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="RegisterRequest.phoneNumber" name="phoneNumber" />
      </div>
      <div class="auth-field">
        <label>País</label>
        <input type="text" [(ngModel)]="RegisterRequest.country" name="country" />
      </div>

      @if (errorMessage()) {
        <p class="auth-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
      </button>

      <div class="auth-divider"><span>o continúa con</span></div>

      <div
        #googleHost
        data-google-host="register"
        class="gsi-host"
      ></div>

      <p class="auth-link">
        ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
