<div class="auth-shell">
  <div class="auth-backdrop"></div>

  <div class="auth-card">
    <a routerLink="/" class="auth-logo">AndrezOG</a>
    <h2 class="auth-title">Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="auth-field">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="credentials.email" name="email" required />
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" required />
      </div>

      @if (errorMessage()) {
        <p class="auth-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="auth-divider"><span>o continúa con</span></div>

      <!-- Botón Google renderizado por GIS, oculto -->
      <div id="googleHiddenBtn" style="display:none;"></div>

      <button type="button" class="btn-google" (click)="googleLogin()">
        <span class="google-icon">G</span> Google
      </button>

      <p class="auth-link">
        ¿No tienes una cuenta? <a routerLink="/register">Regístrate</a>
      </p>
    </form>
  </div>
</div>
