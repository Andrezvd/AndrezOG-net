<!-- Mientras no se gane: el juego -->
<app-game-canvas *ngIf="!showPortfolio" (gameWon)="onGameWon()"></app-game-canvas>

<!-- Cuando se gana: portafolio con video de fondo -->
<div *ngIf="showPortfolio" class="relative w-full h-screen overflow-hidden">

  <!-- Video de fondo -->
  <video autoplay muted loop class="absolute top-0 left-0 w-full h-full object-cover">
    <source src="videoFondo.mp4" type="video/mp4">
  </video>

  <!-- Overlay con gradiente: oscuro en bordes, más claro en centro -->
  <div class="absolute top-0 left-0 w-full h-full bg-linear-to-b from-black/80 via-black/40 to-black/80"></div>
  <div class="absolute top-0 left-0 w-full h-full bg-linear-to-r from-black/60 via-transparent to-black/60"></div>

  <!-- Contenido principal -->
  <div class="relative z-10 flex flex-col h-full">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-8 py-4">
      <span class="text-white text-xl font-bold tracking-wider">AndrezOG</span>
      <div class="flex gap-6 text-white/80">
        <a href="#" class="hover:text-white transition-colors">Get in Touch</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="flex-1 flex flex-col justify-center items-center text-center px-4">
      <h1 class="text-5xl md:text-7xl font-bold text-white mb-4 animate-fade-in">
        Hi, I'm Andrés Olivar
      </h1>
      <p class="text-lg md:text-xl text-white/70 mb-2 animate-fade-in-delay">
        System Engineer / Game Dev / FullStack Developer
      </p>
      <p class="text-md md:text-lg text-white/50 animate-fade-in-delay-2">
        Welcome to my world
      </p>
    </section>

  </div>
</div>

<router-outlet />
